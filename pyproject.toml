[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoquant-financial-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "networkx>=3.2",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ecoquant.retrieval_models]
dense_name = "sentence-transformers/all-MiniLM-L6-v2"
dense_revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
reranker_name = "BAAI/bge-reranker-base"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ecoquant*", "integrations*"]
namespaces = true
[tool.mypy]
explicit_package_bases = true
mypy_path = "src:."
