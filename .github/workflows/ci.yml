name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast CPU-only checks (unit + integration + finvest + lint). No Torch.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v

      - name: Run FinVEST tests (committed fixtures, no cache)
        run: |
          python -m pytest tests/finvest/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check imports
        run: |
          python -c "import ecoquant"
          python -c "from ecoquant.retrieval.base import all_retrievers"
          python -c "from ecoquant.uncertainty.calibration import PlattCalibrator"
          python -c "from ecoquant.attestation.eip712 import keccak256"

  # Heavy research pipeline (needs sentence-transformers/Torch) — one job.
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run research pipeline (fixture mode)
        # Fresh temp output dir: research/results/ is committed and non-empty,
        # and the pipeline refuses to write into a non-empty dir.
        run: |
          python scripts/run_research.py --mode fixture --seed 20260710 \
            --output-dir "$RUNNER_TEMP/research-output"

      - name: Verify artifacts
        run: |
          python -m pytest tests/research/test_research_release.py -v
