name: Integration CI (pinned tool repos)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Second CI lane: installs the three pinned tool repos and REQUIRES every
  # adapter test to RUN (zero skips). Core CI (ci.yml) stays green without the
  # sibling repos (importorskip); this lane proves the adapters actually work.
  adapter-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install EcoQuant
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pinned tool repos (from INTEGRATION_LOCK)
        # Pinned by commit so CI does not track a moving default branch.
        # #egg=<name> is required: pip cannot infer an editable package name
        # from a bare git+https URL with @sha (P0-6 fix — this step was failing
        # with "Could not detect requirement name").
        run: |
          pip install -e "git+https://github.com/ElianChyndale/financial-ai-contracts.git@4b232218ad7a250ce03124d51dfa036082aee284#egg=financial-ai-contracts"
          pip install -e "git+https://github.com/ElianChyndale/financial-systems-verification-kit.git@b0b1024#egg=financial-systems-verification-kit"
          pip install -e "git+https://github.com/ElianChyndale/paper-reproduction-lab.git@9ca75082751c28ca46902f33fb8e269e4b79e05a#egg=paper-reproduction-lab"

      - name: Adapter tests must RUN (zero skips)
        run: |
          python -m pytest tests/integration/ -q --tb=short

      - name: Generate INTEGRATION_REPORT.json
        run: |
          python scripts/generate_integration_report.py
          python -c "import json; d=json.load(open('research/results/INTEGRATION_REPORT.json')); assert d['all_pass'], d"
