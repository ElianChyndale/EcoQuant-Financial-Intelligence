<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinVEST Evidence Review Workbench</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">FinVEST Review</span>
    <span class="reviewer">Reviewer: {{ reviewer }}</span>
    <span class="progress" id="global-progress"></span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
